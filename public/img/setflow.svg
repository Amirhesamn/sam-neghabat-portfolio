<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" font-family="'JetBrains Mono','SF Mono',monospace">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0d12"/><stop offset="1" stop-color="#141019"/>
    </linearGradient>
    <linearGradient id="sf-media" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2540"/><stop offset="0.5" stop-color="#3a2f57"/>
      <stop offset="1" stop-color="#241d33"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="960" fill="url(#sf-bg)"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1400" height="78" fill="#141019"/>
  <line x1="0" y1="78" x2="1400" y2="78" stroke="#2a2435"/>
  <rect x="36" y="26" width="26" height="26" rx="7" fill="#e0a3ff"/>
  <text x="74" y="46" fill="#efe7f6" font-size="22" font-weight="700">Setflow</text>
  <text x="240" y="45" fill="#a99bbd" font-size="15">Assets</text>
  <text x="350" y="45" fill="#6b6079" font-size="15">Review</text>
  <text x="470" y="45" fill="#6b6079" font-size="15">Share</text>
  <rect x="1110" y="22" width="150" height="36" rx="10" fill="#e0a3ff"/>
  <text x="1132" y="45" fill="#0a0a0c" font-size="14" font-weight="700">+ Comment</text>
  <circle cx="1320" cy="39" r="20" fill="#1d1726" stroke="#332a44"/>

  <!-- media canvas with annotation pins -->
  <rect x="36" y="110" width="900" height="600" rx="16" fill="url(#sf-media)" stroke="#2a2435"/>
  <!-- abstract media composition -->
  <circle cx="300" cy="320" r="120" fill="#e0a3ff" opacity="0.18"/>
  <rect x="520" y="240" width="320" height="220" rx="14" fill="#ffffff" opacity="0.07"/>
  <path d="M420 560 Q560 420 720 540 T900 470" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="40"/>
  <!-- play button -->
  <circle cx="486" cy="410" r="46" fill="#0a0a0c" opacity="0.5"/>
  <path d="M472 388 L518 410 L472 432 Z" fill="#efe7f6"/>
  <!-- annotation pins -->
  <g font-size="16" font-weight="700">
    <circle cx="300" cy="250" r="20" fill="#e0a3ff"/><text x="300" y="256" text-anchor="middle" fill="#0a0a0c">1</text>
    <circle cx="700" cy="330" r="20" fill="#e0a3ff"/><text x="700" y="336" text-anchor="middle" fill="#0a0a0c">2</text>
    <circle cx="560" cy="600" r="20" fill="#e0a3ff"/><text x="560" y="606" text-anchor="middle" fill="#0a0a0c">3</text>
  </g>
  <!-- timeline scrubber -->
  <rect x="36" y="730" width="900" height="56" rx="12" fill="#141019" stroke="#2a2435"/>
  <line x1="70" y1="758" x2="900" y2="758" stroke="#2a2435" stroke-width="3"/>
  <line x1="70" y1="758" x2="540" y2="758" stroke="#e0a3ff" stroke-width="3"/>
  <circle cx="540" cy="758" r="9" fill="#e0a3ff"/>
  <text x="40" y="824" fill="#6b6079" font-size="13">00:42 / 01:30 · 4K · annotation engine</text>

  <!-- comments panel -->
  <rect x="970" y="110" width="394" height="800" rx="16" fill="#141019" stroke="#2a2435"/>
  <text x="1000" y="156" fill="#efe7f6" font-size="18" font-weight="700">Comments</text>
  <rect x="1300" y="134" width="44" height="28" rx="14" fill="#1d1726"/><text x="1322" y="153" fill="#e0a3ff" font-size="13" text-anchor="middle">3</text>
  <!-- comment 1 -->
  <g>
    <circle cx="1010" cy="210" r="16" fill="#e0a3ff"/><text x="1010" y="216" text-anchor="middle" font-size="12" fill="#0a0a0c">1</text>
    <text x="1038" y="206" fill="#efe7f6" font-size="14" font-weight="700">Sam N.</text>
    <text x="1110" y="206" fill="#6b6079" font-size="12">2:14</text>
    <rect x="1038" y="220" width="296" height="9" rx="4" fill="#ffffff" opacity="0.12"/>
    <rect x="1038" y="238" width="240" height="9" rx="4" fill="#ffffff" opacity="0.12"/>
  </g>
  <line x1="1000" y1="276" x2="1334" y2="276" stroke="#221c2c"/>
  <g>
    <circle cx="1010" cy="320" r="16" fill="#6cb6ff"/><text x="1010" y="326" text-anchor="middle" font-size="12" fill="#0a0a0c">2</text>
    <text x="1038" y="316" fill="#efe7f6" font-size="14" font-weight="700">Reviewer</text>
    <rect x="1038" y="330" width="296" height="9" rx="4" fill="#ffffff" opacity="0.12"/>
    <rect x="1038" y="348" width="200" height="9" rx="4" fill="#ffffff" opacity="0.12"/>
  </g>
  <line x1="1000" y1="386" x2="1334" y2="386" stroke="#221c2c"/>
  <g>
    <circle cx="1010" cy="430" r="16" fill="#5ce08a"/><text x="1010" y="436" text-anchor="middle" font-size="12" fill="#0a0a0c">3</text>
    <text x="1038" y="426" fill="#efe7f6" font-size="14" font-weight="700">Client</text>
    <rect x="1038" y="440" width="280" height="9" rx="4" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- reactions / engagement -->
  <rect x="1000" y="700" width="334" height="170" rx="12" fill="#0e0d12" stroke="#2a2435"/>
  <text x="1024" y="742" fill="#6b6079" font-size="12" letter-spacing="1">ENGAGEMENT</text>
  <text x="1024" y="792" fill="#e0a3ff" font-size="40" font-weight="800">+40%</text>
  <text x="1024" y="826" fill="#a99bbd" font-size="13">since direct-on-asset comments</text>
  <!-- comment composer -->
  <rect x="1000" y="540" width="334" height="120" rx="12" fill="#0e0d12" stroke="#2a2435"/>
  <text x="1024" y="582" fill="#6b6079" font-size="14">Reply to thread…</text>
  <rect x="1024" y="606" width="120" height="34" rx="8" fill="#e0a3ff"/>
  <text x="1044" y="629" fill="#0a0a0c" font-size="13" font-weight="700">Send</text>
</svg>
