<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" font-family="'JetBrains Mono','SF Mono',monospace">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e12"/><stop offset="1" stop-color="#121218"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="960" fill="url(#pf-bg)"/>
  <!-- top bar -->
  <rect x="0" y="0" width="1400" height="78" fill="#14141a"/>
  <line x1="0" y1="78" x2="1400" y2="78" stroke="#21212a"/>
  <circle cx="48" cy="39" r="9" fill="#c6f24e"/>
  <text x="70" y="45" fill="#ededdf" font-size="22" font-weight="700">PageFolios</text>
  <text x="250" y="44" fill="#8c8c82" font-size="15">Editor</text>
  <text x="340" y="44" fill="#56564f" font-size="15">Templates</text>
  <text x="470" y="44" fill="#56564f" font-size="15">Publish</text>
  <rect x="1090" y="22" width="170" height="36" rx="18" fill="#c6f24e"/>
  <text x="1112" y="45" fill="#0a0a0c" font-size="15" font-weight="700">✦ AI Rewrite</text>
  <circle cx="1320" cy="39" r="20" fill="#1c1c23" stroke="#2a2a33"/>
