  <!-- left form panel -->
  <rect x="40" y="110" width="430" height="800" rx="14" fill="#15151b" stroke="#21212a"/>
  <text x="68" y="158" fill="#c6f24e" font-size="13" letter-spacing="2">RESUME DATA</text>
  <!-- field groups -->
  <g fill="#0e0e12" stroke="#262630">
    <rect x="68" y="180" width="374" height="44" rx="8"/>
    <rect x="68" y="240" width="374" height="44" rx="8"/>
    <rect x="68" y="320" width="180" height="44" rx="8"/>
    <rect x="262" y="320" width="180" height="44" rx="8"/>
    <rect x="68" y="400" width="374" height="92" rx="8"/>
  </g>
  <g fill="#8c8c82" font-size="13">
    <text x="84" y="207">Sam Neghabat</text>
    <text x="84" y="267">Senior Frontend Engineer</text>
    <text x="84" y="347">React</text><text x="278" y="347">Next.js</text>
    <text x="84" y="427">Architected SaaS for 1,000+ users…</text>
  </g>
  <g fill="#56564f" font-size="11" letter-spacing="1">
    <text x="68" y="172">NAME</text><text x="68" y="232">ROLE</text>
    <text x="68" y="312">SKILLS</text><text x="68" y="392">SUMMARY</text>
  </g>
  <!-- json schema chip -->
  <rect x="68" y="540" width="374" height="120" rx="10" fill="#0c0c10" stroke="#21212a"/>
  <text x="88" y="572" fill="#6cb6ff" font-size="12">{ "schema": "resume.v2",</text>
  <text x="88" y="596" fill="#8c8c82" font-size="12">  "render": "instant",</text>
  <text x="88" y="620" fill="#e0a3ff" font-size="12">  "pages": ["cv","portfolio"] }</text>
  <text x="68" y="712" fill="#56564f" font-size="11" letter-spacing="1">OUTPUT</text>
  <rect x="68" y="724" width="220" height="40" rx="8" fill="#c6f24e"/>
  <text x="90" y="749" fill="#0a0a0c" font-size="13" font-weight="700">Generate landing page</text>

  <!-- right: live resume preview (paper) -->
  <rect x="510" y="110" width="850" height="800" rx="14" fill="#ecebe3"/>
  <rect x="510" y="110" width="850" height="800" rx="14" fill="none" stroke="#26261c" opacity="0.15"/>
  <!-- preview header -->
  <text x="560" y="200" fill="#16140f" font-size="44" font-weight="800" font-family="Georgia,serif">Sam Neghabat</text>
  <text x="560" y="232" fill="#5b574a" font-size="16">Senior Frontend Engineer · React · Next.js · TypeScript</text>
  <line x1="560" y1="258" x2="1310" y2="258" stroke="#16140f" stroke-opacity="0.25"/>
  <rect x="560" y="280" width="120" height="14" rx="3" fill="#c6f24e"/>
  <g fill="#16140f" opacity="0.16">
    <rect x="560" y="312" width="750" height="10" rx="3"/>
    <rect x="560" y="332" width="690" height="10" rx="3"/>
    <rect x="560" y="352" width="720" height="10" rx="3"/>
  </g>
  <rect x="560" y="400" width="160" height="14" rx="3" fill="#16140f" opacity="0.55"/>
  <g fill="#16140f" opacity="0.16">
    <rect x="560" y="432" width="700" height="10" rx="3"/>
    <rect x="560" y="452" width="640" height="10" rx="3"/>
    <rect x="560" y="492" width="710" height="10" rx="3"/>
    <rect x="560" y="512" width="600" height="10" rx="3"/>
  </g>
  <rect x="560" y="560" width="160" height="14" rx="3" fill="#16140f" opacity="0.55"/>
  <g fill="#16140f" opacity="0.16">
    <rect x="560" y="592" width="700" height="10" rx="3"/>
    <rect x="560" y="612" width="660" height="10" rx="3"/>
  </g>
  <!-- publish chip -->
  <rect x="560" y="800" width="330" height="48" rx="24" fill="#16140f"/>
  <circle cx="588" cy="824" r="6" fill="#c6f24e"/>
  <text x="606" y="830" fill="#ecebe3" font-size="15" font-family="monospace">cv.samneghabat.dev · live</text>
